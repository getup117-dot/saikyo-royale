  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen{position:absolute;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;padding:10px 16px 16px;gap:12px;overflow-y:auto;animation:fadein .25s ease}
.screen>*{flex-shrink:0}
.screen>.spacer{flex-shrink:1}
.screen.dim::before{content:"";position:fixed;inset:0;background:rgba(10,11,14,.55);z-index:-1}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hdr{position:relative;display:flex;align-items:center;justify-content:center;min-height:54px;flex-shrink:0}
.topbar{display:flex;justify-content:flex-end;flex-shrink:0;margin-bottom:-4px}
.quit{font-size:13px;padding:5px 12px;border-radius:999px;border:2px solid var(--line);background:#2b2e36;box-shadow:0 0 0 2px var(--ink)}
.ffhint{position:absolute;right:8px;bottom:6px;font-size:12px;color:#d8d3c6;background:#0008;border-radius:999px;padding:3px 10px;z-index:8;pointer-events:none}
.quote{text-align:center;font-family:var(--head);font-weight:400;font-size:17px;line-height:1.4;padding:0 8px;text-shadow:0 2px 0 #000}
.narr{text-align:center;font-size:13px;color:#e9d9a8;padding:0 10px;line-height:1.5}
.hdr h2{margin:0;font-family:var(--head);font-weight:400;font-size:24px;letter-spacing:.04em;text-shadow:0 3px 0 var(--ink),0 0 2px var(--ink);
  padding:4px 18px;border-bottom:3px solid var(--line)}
.hdr .back{position:absolute;left:0;width:46px;height:42px;border-radius:10px;border:3px solid var(--line);background:#2a2d35;box-shadow:0 0 0 2px var(--ink);font-size:22px;line-height:1}
.hdr .emb{position:absolute;right:-4px;top:-2px;width:58px;opacity:.9;pointer-events:none}
.btn{display:flex;align-items:center;justify-content:center;gap:.45em;width:100%;padding:13px 10px;border-radius:16px;border:3px solid var(--line);
  box-shadow:0 0 0 3px var(--ink),inset 0 -6px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.18);font-family:var(--head);font-weight:400;font-size:22px;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.55);transition:transform .08s,filter .15s;flex-shrink:0}
.btn:active{transform:scale(.97)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.btn.busy:disabled{filter:none;animation:busy 1s ease-in-out infinite}
@keyframes busy{50%{filter:brightness(1.18)}}
.btn.orange{background:linear-gradient(#f4b640,#cc7812)}
.btn.blue{background:linear-gradient(#3a72d6,#1b3d88)}
.btn.red{background:linear-gradient(#d84a3d,#93221b)}
.btn.gray{background:linear-gradient(#585d68,#3a3e46)}
.btn.small{font-size:16px;padding:9px 8px;border-radius:12px;white-space:nowrap}
.row{display:flex;gap:10px}
.row>*{flex:1}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink);border-radius:14px;padding:12px}
.label{display:inline-block;background:var(--red);border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink);border-radius:8px;padding:2px 12px;font-size:14px}
.muted{color:#b9b6ae;font-weight:500;font-size:13px}
.spacer{flex:1}
.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:#111c;border:2px solid var(--line);padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;max-width:90%;text-align:center;animation:fadein .2s}

/* home */
.title-logo{width:100%;max-width:400px;margin:4px auto 0;display:block;filter:drop-shadow(0 4px 0 #000a)}
.subcopy{text-align:center;font-family:var(--head);font-weight:400;font-size:17px;letter-spacing:.12em;margin-top:-6px;text-shadow:0 2px 0 #000}
.vs-stage{position:relative;flex:1;min-height:200px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px}
.vs-stage img.ch:last-child{transform:scaleX(-1)}
.vs-stage img.ch{width:42%;max-height:240px;object-fit:contain;filter:drop-shadow(0 6px 4px #0009)}
.vs-text{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) skewX(-8deg);font-family:var(--head);font-size:54px;color:var(--amber);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke;text-shadow:0 4px 0 #000}
.home-links{display:flex;justify-content:center;gap:18px}
.home-links button{background:none;border:none;color:#d8d3c6;text-decoration:underline;font-size:14px}

/* character cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ccard{position:relative;background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink);border-radius:14px;padding:8px;text-align:center}
.ccard.sel{border-color:var(--amber);box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--amber)}
.ccard .im{height:120px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 60%,#3b3f49,#22252c 70%);border-radius:10px}
.ccard .im img{max-width:100%;max-height:116px;object-fit:contain}
.ccard .nm{margin-top:6px;font-size:15px;line-height:1.2}
.ccard .ty{font-size:12px;color:var(--amber)}
.ccard .del{position:absolute;right:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:#333;border:2px solid var(--line);font-size:14px}
.newcard{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:170px;border-style:dashed;color:#d8d3c6;font-size:15px}
.newcard b{font-size:40px;line-height:1}
.stars{font-size:12px;letter-spacing:0;text-align:left}
.stars span{white-space:nowrap}
@media (max-width:380px){.stars{font-size:11px}.pcard{padding:7px 5px}}
.stars div{display:flex;justify-content:space-between;gap:6px}
.stars i{font-style:normal;color:var(--amber)}
.stars em{font-style:normal;color:#555b66}

/* prep */
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.pcard{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink);border-radius:14px;padding:8px;text-align:center;position:relative}
.ptag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:var(--head);font-size:16px;padding:0 12px;border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink);border-radius:6px}
.ptag.p1{background:var(--blue)} .ptag.p2{background:var(--red)}
.pcard img{width:100%;height:92px;object-fit:contain;margin-top:8px}
.pcard .nm{font-size:13px;margin-top:4px;line-height:1.25}
.pcard .sp{font-size:11px;color:#d8d3c6}
.pcard .ty{font-size:12px;color:var(--amber);margin:2px 0}
.vsmall{font-family:var(--head);font-size:34px;color:var(--amber);-webkit-text-stroke:2px var(--ink);paint-order:stroke;transform:skewX(-8deg)}
.handoff{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px}
.handoff .hands{display:flex;align-items:center;gap:8px;font-size:44px}
@keyframes pass{0%,100%{transform:translateX(-14px) rotate(-6deg)}50%{transform:translateX(14px) rotate(6deg)}}
.handoff .hoimg{width:170px;animation:hand 1.6s ease-in-out infinite}
@keyframes hand{0%,100%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}}
.handoff h3{margin:0;font-family:var(--head);font-weight:400;font-size:28px}

/* top HP bar */
.hpbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink);border-radius:12px;padding:6px 8px;flex-shrink:0}
.hpside{display:flex;align-items:center;gap:6px;min-width:0}
.hpside.r{flex-direction:row-reverse;text-align:right}
.hpside img{width:40px;height:40px;object-fit:contain;flex-shrink:0}
.hpside .meta{flex:1;min-width:0}
.hpside .tag{font-family:var(--head);font-size:12px;padding:0 6px;border-radius:4px;display:inline-block}
.hpside .tag.p1{background:var(--blue)} .hpside .tag.p2{background:var(--red)}
.hpnum{font-family:var(--head);font-size:18px;line-height:1}
.hpnum small{font-size:11px;margin-right:2px}
.bar{height:9px;background:#3a3d44;border-radius:5px;overflow:hidden;border:1px solid #000;margin-top:2px}
.bar i{display:block;height:100%;background:linear-gradient(#6fe06a,#2fa82c);transition:width .35s ease}
.hpside.r .bar i{margin-left:auto}
.bar i.mid{background:linear-gradient(#ffd75a,#e0a31a)} .bar i.low{background:linear-gradient(#ff6a5a,#c62a1d)}
.hpside.r .turnlbl{font-family:var(--head);font-size:13px;text-align:center;line-height:1.1;color:var(--amber)}
.turnlbl b{display:block;font-size:22px;color:#fff;-webkit-text-stroke:1px var(--ink)}

/* input */
.prev{padding:8px 10px}
.prev .pr{display:grid;grid-template-columns:52px repeat(6,minmax(0,1fr));align-items:center;gap:5px;font-size:11px}
.prev .pr+.pr{margin-top:4px}
.prev .pr>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev .pr .mini{width:100%;min-width:0;height:26px}
.prev .pr .mini img{width:20px;height:20px}
.mini{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;border:2px solid #000}
.mini img{width:20px;height:20px}
.mini.R{background:var(--rock)} .mini.S{background:var(--scissors)} .mini.P{background:var(--paper)} .mini.X{background:var(--special);font-family:var(--head);font-size:13px}
.inhead{display:flex;align-items:center;gap:10px}
.inhead h3{flex:1;margin:0;font-family:var(--head);font-weight:400;font-size:20px;background:#2b2e36;border:3px solid var(--line);box-shadow:0 0 0 2px var(--ink);border-radius:10px 30px 30px 10px;padding:6px 12px}
.timer{width:54px;height:54px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:28px;
  background:conic-gradient(var(--amber) var(--p,100%),#2b2e36 0);box-shadow:0 0 0 3px var(--ink)}
.timer span{width:42px;height:42px;border-radius:50%;background:#16181d;display:flex;align-items:center;justify-content:center}
.timer.warn span{color:#ff6a5a}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:5/6;border-radius:10px;border:3px solid var(--line);box-shadow:0 0 0 2px var(--ink);background:#3a3e47;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--head);font-size:20px;color:#9aa0ab;position:relative}
.slot.next{border-color:var(--amber);animation:blink .8s ease-in-out infinite}
@keyframes blink{50%{box-shadow:0 0 0 2px var(--ink),0 0 12px 3px var(--amber)}}
.slot.R{background:var(--rock)} .slot.S{background:var(--scissors)} .slot.P{background:var(--paper)} .slot.X{background:var(--special);color:#fff}
.slot img{width:80%}
.slot small{position:absolute;top:2px;left:5px;font-size:10px;color:#0008}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pk{aspect-ratio:1/0.92;border-radius:14px;border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink),inset 0 -5px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:#1b1b1b;gap:2px;transition:transform .06s}
.pk:active{transform:scale(.94)}
.hpanel{padding:7px 10px;display:flex;flex-direction:column;gap:5px}
.hrow{display:flex;align-items:center;gap:8px;font-size:12px}
.hrow .hl{width:64px;flex-shrink:0;color:#d8d3c6}
.hrow.opp .hl{color:#ff8a7a}
.hrow .hc{display:flex;align-items:center;gap:4px;flex:1}
.hrow .hc b{font-family:var(--head);font-weight:400;font-size:14px}
.hrow b.up{color:#ff7a5c}.hrow b.dn{color:#8fb4ef}.hrow b.zero{color:#8a8f99}
.hb{position:absolute;top:4px;right:5px;font-size:11px;padding:1px 5px;border-radius:6px;border:1px solid #000;color:#fff}
.hb.up{background:#d8392e}.hb.dn{background:#4a4e57}
.pk img{width:52%}
.pk.R{background:var(--rock)} .pk.S{background:var(--scissors)} .pk.P{background:var(--paper)}
.pk.X{background:linear-gradient(#ee5a3f,#a8231a);color:#fff}
.pk.X img{width:64%}
.pk:disabled{filter:grayscale(1) brightness(.55)}
.note{font-size:12px;text-align:center;color:#d8d3c6;font-weight:500}

/* battle */
.reveal{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px}
.reveal .mini{width:100%;height:auto;aspect-ratio:1;border-radius:50%;opacity:.25;transition:opacity .2s,transform .2s}
.reveal .mini img{width:70%;height:auto}
.reveal .mini.on{opacity:1}
.reveal .mini.win{transform:scale(1.12);box-shadow:0 0 0 2px var(--amber),0 0 10px var(--amber)}
.reveal .mini.lose{filter:brightness(.55)}
.reveal .mini.q{background:#2b2e36;color:#666;font-family:var(--head);opacity:1}
.reveal .sep{grid-column:1/-1;height:2px;background:#ffffff22}
.stage{position:relative;flex:1;min-height:250px}
.fighter{position:absolute;bottom:4%;width:44%;height:78%;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.fighter.l{left:2%} .fighter.r{right:2%}
.fighter img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 5px #000a);transform-origin:50% 100%}
.ghost{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;opacity:.3}
.ghost img{max-width:100%;max-height:100%;object-fit:contain;filter:grayscale(.3)}
.impact{position:absolute;width:160px;height:160px;margin:-80px 0 0 -80px;pointer-events:none;z-index:5}
.pop.small{font-size:24px}
.ccard .rec{font-size:13px;margin-top:3px}.ccard .rec b{color:var(--amber)}
.ccard .rect{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:3px}.ccard .rect span{font-size:10px;background:#3a2c10;color:#f2c46b;border:1px solid #f2c46b88;border-radius:999px;padding:1px 6px}
.pop.tagp{font-size:22px;-webkit-text-stroke:2px #000;white-space:nowrap}
.pop.tagp.atk{color:#ffcf3a;-webkit-text-stroke-color:#7a2a00}
.pop.tagp.guard{color:#9fd0ff;-webkit-text-stroke-color:#0d2f6b}
.shield{position:absolute;top:22%;width:42%;height:58%;border-radius:50% 50% 46% 46%;border:5px solid #9fd0ff;background:radial-gradient(#9fd0ff55,#9fd0ff11 70%);box-shadow:0 0 18px #7fc3ff;z-index:5;pointer-events:none}
.pop{position:absolute;font-family:var(--head);font-size:34px;color:#fff;-webkit-text-stroke:3px #b3160e;paint-order:stroke;z-index:6;pointer-events:none;text-shadow:0 3px 0 #000}
.callout{position:absolute;left:50%;top:22%;transform:translateX(-50%) skewX(-8deg);font-family:var(--head);font-size:44px;white-space:nowrap;color:var(--amber);
  -webkit-text-stroke:4px var(--ink);paint-order:stroke;text-shadow:0 5px 0 #000;z-index:7;pointer-events:none}
.callout.blue{color:#7fc3ff} .callout.white{color:#fff}
.shake{animation:shake .3s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}

.cutin .tint{position:absolute;inset:0;mix-blend-mode:color;opacity:.75}
.cutin .tint2{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.5}
.fxim{position:absolute;pointer-events:none;filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
.cutin .lines{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0 1.2deg,transparent 1.2deg 7deg);
  -webkit-mask:radial-gradient(circle,transparent 18%,#000 45%);mask:radial-gradient(circle,transparent 18%,#000 45%);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cutin .big{position:absolute;bottom:22%;width:78%;height:56%;display:flex;align-items:flex-end;justify-content:center}
.cutin .big img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 18px rgba(255,255,255,.55))}
.cutin .band{position:absolute;left:-5%;right:-5%;bottom:8%;padding:10px 7% 14px;background:linear-gradient(90deg,#8c1810,#d23a22 60%,#8c1810);transform:rotate(-6deg);border-top:4px solid var(--line);border-bottom:4px solid var(--line);box-shadow:0 0 0 3px var(--ink)}
.cutin .band .nm{font-family:var(--head);font-size:clamp(22px,8vw,38px);line-height:1.1;-webkit-text-stroke:3px var(--ink);paint-order:stroke;text-shadow:0 4px 0 #000;transform:skewX(-8deg);word-break:keep-all;overflow-wrap:anywhere}
.cutin .badges{display:flex;gap:6px;margin-bottom:4px}
.badge{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;border:2px solid var(--line);box-shadow:0 0 0 2px var(--ink);color:#fff;text-shadow:0 1px 0 #000}
.cutin .flash{position:absolute;inset:0;background:#fff;opacity:0}
.cutin .beam{position:absolute;height:28%;top:30%;left:30%;right:-10%;border-radius:999px;transform-origin:left center;transform:scaleX(0)}
.ptc{position:absolute;width:18px;height:18px}
.cutin.half{inset:auto 0 auto 0;height:50%}
.cutin.half.top{top:0} .cutin.half.bot{bottom:0}
.cutin.half .big{height:80%;bottom:12%;width:60%}
.cutin.half .band{bottom:6%;padding:6px 6% 8px}
.cutin.half .band .nm{font-size:clamp(18px,6vw,28px)}

/* result */
.ribbon{margin:6px auto 0;font-family:var(--head);font-size:44px;padding:2px 26px;background:linear-gradient(#2f63c4,#173a86);border:4px solid var(--line);box-shadow:0 0 0 3px var(--ink);transform:skewX(-10deg) rotate(-4deg);text-shadow:0 4px 0 #000}
.ribbon.p2{background:linear-gradient(#d84a3d,#8e2018)} .ribbon.draw{background:linear-gradient(#666,#333)}
.spot{position:relative;flex:1;min-height:150px;display:flex;align-items:flex-end;justify-content:center}
.spot::before{content:"";position:absolute;left:50%;top:-10%;width:120%;height:115%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 92%,rgba(255,240,200,.55),transparent 45%),linear-gradient(180deg,rgba(255,240,200,.18),transparent 70%);clip-path:polygon(40% 0,60% 0,95% 100%,5% 100%)}
.spot .crowd{position:absolute;left:-16px;right:-16px;bottom:-6px;width:calc(100% + 32px);max-width:none;max-height:none;animation:cheer .5s ease-in-out infinite alternate;filter:none;z-index:1}
@keyframes cheer{to{transform:translateY(-4px)}}
.spot img.win{position:relative;z-index:2;max-width:62%;max-height:200px;object-fit:contain;filter:drop-shadow(0 10px 6px #000a);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.titles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.titles span{background:#2b2e36;border:2px solid var(--amber);border-radius:999px;padding:4px 14px;font-size:15px;color:var(--amber)}

/* create */
.steps{display:flex;gap:4px;justify-content:center}
.steps i{width:28px;height:6px;border-radius:3px;background:#4a4e57}
.steps i.on{background:var(--amber)}
.photo-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-btns label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1;border-radius:16px;border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink);background:#2b2e36;font-size:16px}
.photo-btns label b{font-size:46px;line-height:1}
.photo-btns input{display:none}
.checker{background:repeating-conic-gradient(#555a64 0 25%,#6b707b 0 50%) 0 0/18px 18px;border-radius:10px;border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink)}
.cropwrap{position:relative;touch-action:none;user-select:none;align-self:center;max-width:100%}
.cropwrap img{display:block;max-width:100%;max-height:52vh;border-radius:6px}
.croprect{position:absolute;border:3px solid var(--amber)}
.cropclip{position:absolute;inset:0;overflow:hidden;border-radius:6px;pointer-events:none}
.cropdim{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
.croprect i{position:absolute;width:26px;height:26px;background:var(--amber);border:3px solid var(--ink);border-radius:50%}
.croprect i.tl{left:-14px;top:-14px} .croprect i.tr{right:-14px;top:-14px} .croprect i.bl{left:-14px;bottom:-14px} .croprect i.br{right:-14px;bottom:-14px}
.cutcanvas{display:block;max-width:100%;max-height:46vh;touch-action:none;align-self:center}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .tg{flex:1;padding:8px;border-radius:10px;border:3px solid var(--line);background:#2b2e36;font-size:15px}
.tools .tg.on{background:var(--amber);color:#1b1100}
.adj{display:flex;flex-direction:column;gap:2px;font-size:13px}.adj input{width:100%;accent-color:var(--amber)}.adj .adjh{font-weight:700}.adj .ends{display:flex;justify-content:space-between;font-size:12px;color:#d8d3c6}
.fld{display:flex;flex-direction:column;gap:6px}
.fld b{font-size:15px;display:flex;align-items:baseline;gap:8px}
.fld b small{font-size:12px;color:#b9b6ae;font-weight:500}
.fld textarea{width:100%;border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink);border-radius:12px;background:#f6f3ec;color:#111;font:inherit;font-size:16px;padding:10px 14px;outline:none;resize:none;-webkit-appearance:none;line-height:1.4}
.fld textarea:focus{border-color:var(--amber)}
.fld textarea::placeholder{color:#9a968c;font-weight:500}
.fld input{width:100%;border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink);border-radius:12px;background:#f6f3ec;color:#111;font:inherit;font-size:18px;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none}
.fld input:focus{border-color:var(--amber)}
.fld input::placeholder{color:#9a968c;font-weight:500}
.faceset{display:flex;flex-direction:column;align-items:center;gap:6px}
.fstage{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%}
.fstage .infoimg{max-width:42%;filter:drop-shadow(0 6px 4px #0009)}
.farrow{color:#f2c46b;font-size:18px;align-self:center;opacity:.8}
.foe{position:relative;display:flex;flex-direction:column;align-items:center}
.foe img{height:72px;transform:scaleX(-1);filter:brightness(0) opacity(.55)}
.foe b{position:absolute;top:38%;font-size:14px;color:#fff;background:var(--red);border:2px solid var(--line);border-radius:6px;padding:0 6px}
.faceset .btn{width:auto;padding:7px 16px;font-size:14px}
.optopen .faceset{flex-direction:row;justify-content:center;gap:12px}.optopen .fstage{width:auto}.optopen .foe img{height:44px}.optopen .fstage .infoimg{max-height:48px}.optopen .farrow{font-size:13px}
.infoimg{max-height:88px}
.cpulvtag{color:#f2c46b}
.hidbadge.onl{background:#1f6fb8}
.sp.author{color:#9cc2ff;font-size:11px}
.ccard .arena{font-size:11px;color:#9cc2ff;margin-top:4px;line-height:1.5}.ccard .arena b{color:#ffcf3a}
.pubbtn.off{background:#4a4d55;margin-top:4px}
.pubbtn{margin-top:6px;background:#1f6fb8;color:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 10px;font:inherit;font-size:12px;font-weight:700}
.linkbtn{background:none;border:0;color:#a9a59b;font:inherit;font-size:12px;text-decoration:underline;padding:4px}
.release{position:relative;width:220px;height:220px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.release img{max-width:80%;max-height:80%;filter:drop-shadow(0 0 18px #9cc2ff);animation:relfly 1.6s ease-out}
.release .ring{position:absolute;inset:0;border-radius:50%;border:4px solid #9cc2ff;box-shadow:0 0 30px #7fc3ff,inset 0 0 30px #7fc3ff;animation:relring 1.6s ease-out}
@keyframes relfly{0%{transform:scale(.4) translateY(40px);opacity:0}60%{transform:scale(1.1) translateY(-10px);opacity:1}100%{transform:none}}
@keyframes relring{0%{transform:scale(.2);opacity:0}50%{opacity:1}100%{transform:scale(1.15);opacity:.8}}
.relt{text-align:center;font-family:var(--head);font-size:34px;color:#fff;paint-order:stroke;-webkit-text-stroke:5px #1f6fb8;text-shadow:0 3px 0 #000}
.rank{display:flex;flex-direction:column;gap:6px}
.modal .panel{max-height:100%;overflow-y:auto}
.terms{text-align:left;background:#0005;border:1px solid #ffffff33;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.55}.terms b{font-size:13px}.terms ul{margin:4px 0 6px;padding-left:18px}.terms li{margin:2px 0}
.agree{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}.agree input{width:22px;height:22px;accent-color:var(--amber)}
.rtabs{display:flex;gap:6px}.rtabs button{flex:1;padding:9px;border-radius:999px;border:2px solid var(--line);background:#2b2e36;color:#fff;font:inherit;font-weight:700}.rtabs button.on{background:var(--amber);color:#201000}
.rname-set{display:flex;gap:6px}.rname-set input{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;background:#f6f3ec;color:#111;font:inherit;font-size:15px;padding:8px 10px}.rname-set .btn{width:auto;padding:8px 12px;font-size:13px}
.rrow{display:flex;align-items:center;gap:8px;background:#2b2e36;border:2px solid #ffffff33;border-radius:12px;padding:6px 10px}
.rrow.mine{border-color:#f2c46b;background:#3a2c10}
.rrow .rn{font-family:var(--head);font-size:20px;width:30px;text-align:center;color:#f2c46b}
.rrow img{width:46px;height:46px;object-fit:contain}
.rrow .rinfo{flex:1;min-width:0}.rrow .rname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rrow .rname span{font-size:10px;background:#f2c46b;color:#201000;border-radius:999px;padding:0 6px;margin-left:6px}
.rrow .rinfo .muted{font-size:11px}
.rrow .rscore{text-align:right}.rrow .rscore b{display:block;color:#ffcf3a}.rrow .rscore small{font-size:11px;color:#b9b6ae}
.streak{text-align:center;font-family:var(--head);font-size:22px;color:#ffcf3a;line-height:1.3}.streak small{display:inline-block;margin-left:8px;font-size:13px;background:var(--red);color:#fff;border-radius:999px;padding:1px 8px;vertical-align:middle}.streak em{display:block;font-style:normal;font-family:inherit;font-size:12px;color:#d8d3c6}.streak.lost{font-size:16px;color:#d8d3c6}
.foundbn{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:40;background:linear-gradient(#f5c443,#d98a12);color:#201000;border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink),0 0 30px #f5c443;border-radius:14px;padding:10px 22px;text-align:center;animation:foundin .5s ease-out}.foundbn{white-space:nowrap}.foundbn b{display:block;font-family:var(--head);font-size:26px}.foundbn small{font-size:13px;font-weight:700}
@keyframes foundin{from{transform:translateX(-50%) scale(.3);opacity:0}}
.ccard{position:relative}.hidbadge{position:absolute;left:6px;top:6px;z-index:2;font-size:10px;background:#7a3cc4;color:#fff;border:1px solid #fff8;border-radius:999px;padding:1px 7px}
.screen.side1{box-shadow:inset 0 0 0 5px var(--blue)}.screen.side2{box-shadow:inset 0 0 0 5px var(--red)}
.screen.side1 .inhead h3{background:#1d3566}.screen.side2 .inhead h3{background:#6a1f1b}
.hoch{display:flex;align-items:center;gap:10px;justify-content:center;font-size:16px}.hoch img{height:64px;max-width:80px;object-fit:contain;filter:drop-shadow(0 4px 3px #0009)}.hoch .tag{display:inline-block;border:2px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px;font-size:13px}.hoch .tag.p1{background:var(--blue)}.hoch .tag.p2{background:var(--red)}.hoch b{font-size:20px;margin-right:2px}
.winname{text-align:center;font-family:var(--head);font-size:30px;line-height:1.15;color:#fff;paint-order:stroke;-webkit-text-stroke:5px var(--blue);text-shadow:0 3px 0 #000}.winname.p2{-webkit-text-stroke-color:var(--red)}
.optbox{border:2px dashed #ffffff55;border-radius:14px;background:#0003}
.opttg{width:100%;background:none;border:0;color:#d8d3c6;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font:inherit;font-size:15px;font-weight:700}
.opttg small{font-size:12px;color:#a9a59b;font-weight:500;border:1px solid #ffffff44;border-radius:999px;padding:2px 9px}
.optbox .optbody{display:none;flex-direction:column;gap:10px;padding:0 12px 12px}
.optbox.open .opttg{display:none}
.optbox.open .optbody{display:flex;padding-top:12px}
.optbox.open::before{content:'書かなくてもOK';display:block;font-size:12px;color:#a9a59b;padding:8px 12px 0}
.optbox.open .optbody{padding-top:6px}
.fld.opt b{font-size:13px;color:#d8d3c6}
.fld.opt input,.fld.opt textarea{font-size:15px;padding:9px 12px;background:#e9e5dc;box-shadow:none;border-width:2px}
.feat{display:flex;flex-wrap:wrap;gap:8px}
.feat button{padding:8px 12px;border-radius:999px;border:3px solid var(--line);background:#2b2e36;font-size:14px}
.feat button.on{background:var(--amber);color:#1b1100}
.feat h4{width:100%;margin:6px 0 0;font-size:13px;color:#d8d3c6}
.kantei{display:flex;flex-direction:column;gap:10px;align-items:center}
.kantei img{max-height:180px;max-width:70%;object-fit:contain;filter:drop-shadow(0 6px 4px #0009)}
.scan{position:relative}
.scan::after{content:"";position:absolute;left:-10%;right:-10%;height:4px;background:var(--amber);box-shadow:0 0 16px 4px var(--amber);top:0;animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{to{top:100%}}
.kline{font-size:17px;opacity:0;transform:translateX(-10px);transition:all .35s}
.kline.on{opacity:1;transform:none}
.kline b{color:var(--amber)}
.kres{font-family:var(--head);font-size:34px;color:var(--amber);-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:0 3px 0 #000;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.kres.on{transform:scale(1)}
.statbox{width:100%;font-size:15px}
.statbox .st{display:grid;grid-template-columns:70px 1fr 34px;align-items:center;gap:8px;margin:4px 0}
.statbox .st .g{height:12px;background:#3a3d44;border-radius:6px;overflow:hidden;border:1px solid #000}
.statbox .st .g i{display:block;height:100%;background:linear-gradient(90deg,#f6c14a,#e07a12);width:0;transition:width .6s ease}
.cpulv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cpulv button{padding:10px 4px;border-radius:12px;border:3px solid var(--line);background:#2b2e36;font-size:15px}
.cpulv button.on{background:var(--amber);color:#1b1100}
.modal{position:absolute;inset:0;background:#000b;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .panel{width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
/* tutorial coach */
.coach{position:fixed;inset:0;z-index:60;pointer-events:auto}
.coach.act{pointer-events:none}
.coach.full{background:#000b}
.coach .hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px #000b;outline:3px solid var(--amber);transition:all .25s;pointer-events:none}
.coach.act .hole{animation:holepulse 1.1s ease-in-out infinite}
@keyframes holepulse{50%{outline-color:#fff}}
.coach .bub{position:fixed;left:12px;right:12px;max-width:440px;margin:0 auto;background:#fff8e6;color:#201000;border:3px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;line-height:1.6;box-shadow:0 6px 0 #0006;pointer-events:none}
.coach .bub small{display:block;margin-top:6px;font-size:12px;color:#8a6a2a;font-weight:700}
.coach .bub b{color:#c2410c}
.coach .skip{position:fixed;right:10px;top:10px;pointer-events:auto;background:#0009;color:#fff;border:2px solid #fff6;border-radius:999px;padding:6px 12px;font-size:13px}

/* ========= game data ========= */
const TYPES={
  power:{n:'パワー型',a:50,d:20,h:30,s:20},
  heavy:{n:'重戦士型',a:40,d:30,h:30,s:20},
  guard:{n:'ガード型',a:20,d:50,h:40,s:10},
  tough:{n:'タフ型',a:30,d:30,h:50,s:10},
  speed:{n:'スピード型',a:30,d:10,h:30,s:50},
  atkspd:{n:'攻速型',a:40,d:20,h:20,s:40},
  defspd:{n:'防速型',a:20,d:40,h:20,s:40},
  balance:{n:'バランス型',a:30,d:30,h:30,s:30}
};
const STAT_NAMES={a:'攻撃',d:'防御',h:'体力',s:'すばやさ'};
const FEATURES=[
  {k:'a',items:['大きなこぶし','ぶき','ツノ','キバ・ツメ']},
  {k:'d',items:['たて','よろい','こうら','かたいウロコ']},
  {k:'h',items:['大きなからだ','ふとい足','ながいしっぽ']},
  {k:'s',items:['つばさ','ながい足','くるま・タイヤ','マント']}
];
function featCat(f){for(const g of FEATURES)if(g.items.includes(f))return g.k;return null}
function typeFromFeatures(fs){return typeFromCats(fs.map(featCat))}
function typeFromCats(cs){
  const c=new Set(cs.filter(k=>'adhs'.includes(k)&&k));
  const has=k=>c.has(k);
  if(c.size===0)return 'balance';
  if(c.size===1){return {a:'power',d:'guard',h:'tough',s:'speed'}[[...c][0]]}
  if(has('a')&&has('d'))return 'heavy';
  if(has('a')&&has('s'))return 'atkspd';
  if(has('d')&&has('s'))return 'defspd';
  if(has('a')&&has('h'))return 'power';
  if(has('d')&&has('h'))return 'guard';
  return 'balance';
}
function nearestType(st){let best='balance',bd=1e9;for(const [k,t] of Object.entries(TYPES)){const d=Math.abs(t.a-st.a)+Math.abs(t.d-st.d)+Math.abs(t.h-st.h)+Math.abs(t.s-st.s);if(d<bd){bd=d;best=k}}return best}
function validStats(x){return x&&['a','d','h','s'].every(k=>Number.isFinite(x[k]))}
function statsOf(ch){if(validStats(ch.stats)){const t=ch.stats;return {n:ch.style||TYPES[nearestType(t)].n,a:t.a,d:t.d,h:t.h,s:t.s}}return TYPES[ch.type]||TYPES.balance}
function handsOf(ch){const h=ch.hands||{};const v=k=>Number.isFinite(h[k])?h[k]:0;return normHands({R:v('R'),S:v('S'),P:v('P')})}
function hpOf(t){return 180+2*t.h}
function normStats(raw){const st={};for(const k of ['a','d','h','s']){let v=Math.round((+raw[k]||30)/10)*10;st[k]=Math.min(50,Math.max(10,v))}
  const order=['a','d','h','s'].sort((x,y)=>(+raw[y]||0)-(+raw[x]||0));let sum=st.a+st.d+st.h+st.s,guard=40;
  while(sum!==120&&guard-->0){if(sum>120){const k=[...order].reverse().find(k=>st[k]>10)||order.find(k=>st[k]>10);st[k]-=10;sum-=10}else{const k=order.find(k=>st[k]<50);st[k]+=10;sum+=10}}
  return st}
function normHands(raw){const o={};for(const k of ['R','S','P']){let v=Math.round((+((raw||{})[k])||0)/10)*10;o[k]=Math.min(20,Math.max(-20,v))}
  let sum=o.R+o.S+o.P,guard=12;const ks=['R','S','P'];
  while(sum!==0&&guard-->0){if(sum>0){const k=ks.filter(k=>o[k]>-20).sort((x,y)=>o[x]-o[y])[0];o[k]-=10;sum-=10}else{const k=ks.filter(k=>o[k]<20).sort((x,y)=>o[x]-o[y])[0];o[k]+=10;sum+=10}}
  return o}
function handsText(h){const parts=['R','S','P'].filter(k=>h[k]).map(k=>`${HAND_NAME[k]}${h[k]>0?'+':'−'}${Math.abs(h[k])}`);return parts.length?parts.join('・'):'得手不得手なし'}
function atkMod(a){return a===10?[-10,2]:a===20?[-10,1]:a===40?[10,1]:a===50?[10,2]:[0,0]}
function defMod(d){return d===10?[10,2]:d===20?[10,1]:d===40?[-10,1]:d===50?[-10,2]:[0,0]}
function inputTime(mySpd,opSpd){return 12+(mySpd-opSpd)/80}
function mikiriCount(s0,s1){return s0===s1?0:6}

const MOTIONS={near:'接近',shot:'飛び道具',all:'全体攻撃'};
const MOTION_KW={
  all:['メテオ','ストーム','竜巻','たつまき','トルネード','ブリザード','ノヴァ','ノバ','ばくはつ','爆発','バクハツ','エクスプロージョン','ハリケーン','じしん','地震','レイン','あめ','ゼロ','全','大爆','ビッグバン','インパクト'],
  shot:['ビーム','ショット','キャノン','砲','波','はどう','波動','レーザー','ミサイル','ボール','たま','弾','アロー','ブレス','ブラスト','スパーク','フラッシュ'],
  near:['パンチ','キック','ブレイク','ナックル','タックル','アタック','斬','スラッシュ','カッター','ソード','けん','剣','クロー','かみつき','キバ','ダイブ','ドロップ','チョップ','ラッシュ','ストライク','ヘッド','ハンマー','クラッシュ']
};
function detectFx(name){
  const s=(name||'').normalize('NFKC');
  const all=[];
  for(const [k,v] of Object.entries(ATTRS))for(const w of v.kw)all.push([w,k]);
  all.sort((a,b)=>b[0].length-a[0].length);
  const mask=new Array(s.length).fill(false);const hits=[];
  for(const [w,k] of all){let i=0;while((i=s.indexOf(w,i))>=0){let ok=true;for(let j=i;j<i+w.length;j++)if(mask[j]){ok=false;break}
    if(ok){for(let j=i;j<i+w.length;j++)mask[j]=true;hits.push([i,k])}i+=w.length}}
  hits.sort((a,b)=>a[0]-b[0]);
  const attrs=[];for(const [,k] of hits)if(!attrs.includes(k)&&attrs.length<2)attrs.push(k);
  let motion=null;
  for(const m of ['all','shot','near'])if(MOTION_KW[m].some(w=>s.includes(w))){motion=m;break}
  if(!attrs.length)attrs.push('none');
  if(!motion)motion=attrs[0]==='none'?'shot':'near';
  return {attrs,motion};
}
function fxCandidates(name){
  const d=detectFx(name);const out=[d];
  for(const m of ['near','shot','all'])if(m!==d.motion)out.push({attrs:d.attrs.slice(),motion:m});
  return out.slice(0,3);
}

/* ========= battle engine ========= */
const BEATS={R:'S',S:'P',P:'R'};
const SPECIAL_DMG=50;
let MIKIRI_DMG=10;
const KANJI_NUM=['','一','二','三','四','五','六'];
function newFighter(ch){const t=statsOf(ch);return {ch,img:ch.img,t,hands:handsOf(ch),maxHp:hpOf(t),hp:hpOf(t),specialUsed:false,taken:0}}
function newTurnMods(f){const am=atkMod(f.t.a),dm=defMod(f.t.d);return {atk:am[0],atkLeft:am[1],atkN:am[1],def:dm[0],defLeft:dm[1],defN:dm[1]}}
function resolveTurn(F,H,turn,stats){
  const mods=[newTurnMods(F[0]),newTurnMods(F[1])];
  let combo=[0,0];const ev=[];
  const spdWin=F[0].t.s>F[1].t.s?0:F[1].t.s>F[0].t.s?1:-1;let mikiriLeft=mikiriCount(F[0].t.s,F[1].t.s);
  for(let i=0;i<6;i++){
    const a=H[0][i],b=H[1][i];const e={i,a,b};
    if(a==='X')F[0].specialUsed=true; if(b==='X')F[1].specialUsed=true;
    if(a==='X'&&b==='X'){e.kind='clash';combo=[0,0]}
    else if(a==='X'||b==='X'){const w=a==='X'?0:1;e.kind='special';e.w=w;e.dmg=SPECIAL_DMG;combo[w]++;combo[1-w]=0;stats[w].specialHit=true}
    else if(a===b){e.kind='tie';combo=[0,0];
      if(spdWin>=0&&mikiriLeft>0){mikiriLeft--;e.mikiri=spdWin;e.dmg=MIKIRI_DMG;stats[spdWin].mikiri++}}
    else{const w=BEATS[a]===b?0:1;const l=1-w;let dmg=30+((F[w].hands||{})[w===0?a:b]||0);e.handMod=((F[w].hands||{})[w===0?a:b]||0);
      if(mods[w].atkLeft>0){dmg+=mods[w].atk;mods[w].atkLeft--;e.atkUsed=true}
      if(mods[l].defLeft>0){dmg+=mods[l].def;mods[l].defLeft--;e.defUsed=true}
      dmg=Math.max(10,dmg);e.kind='win';e.w=w;e.dmg=dmg;if(e.handMod>0)stats[w].strongHits=(stats[w].strongHits||0)+1;combo[w]++;combo[l]=0}
    if(e.dmg){const tgt=e.kind==='tie'?1-e.mikiri:1-e.w;F[tgt].hp=Math.max(0,F[tgt].hp-e.dmg);F[tgt].taken+=e.dmg;e.tgt=tgt}
    e.combo=e.w!=null?combo[e.w]:0;
    if(e.w!=null)stats[e.w].maxCombo=Math.max(stats[e.w].maxCombo,combo[e.w]);
    e.hp=[F[0].hp,F[1].hp];
    ev.push(e);
    if(F[0].hp<=0||F[1].hp<=0){e.ko=F[0].hp<=0?(F[1].hp<=0?2:0):1;if(e.kind==='special')stats[e.w].specialFinish=true;break}
  }
  return ev;
}

/* ========= CPU ========= */
const TYPE_BIAS={power:'R',heavy:'R',guard:'P',tough:'P',speed:'S',atkspd:'S',defspd:'P',balance:null};
const rnd=n=>Math.floor(Math.random()*n);
const randHand=()=>'RSP'[rnd(3)];
function cpuHands(M,side){
  const lv=M.cpuLevel,me=M.F[side],opp=M.F[1-side],turn=M.turn;
  const h=[];
  for(let i=0;i<6;i++){
    if(lv==='weak')h.push(randHand());
    else if(lv==='normal'){const hs=me.hands||{R:0,S:0,P:0};const top=['R','S','P'].sort((x,y)=>hs[y]-hs[x])[0];const b=hs[top]>0?top:TYPE_BIAS[me.ch.type];h.push(b&&Math.random()<.45?b:randHand())}
    else{
      const prev=M.history.length?M.history[M.history.length-1][1-side]:null;
      const oh=opp.hands||{R:0,S:0,P:0};const oTop=['R','S','P'].sort((x,y)=>oh[y]-oh[x])[0];
      const mh=me.hands||{R:0,S:0,P:0};const mTop=['R','S','P'].sort((x,y)=>mh[y]-mh[x])[0];
      const r=Math.random();
      if(oh[oTop]>0&&r<.3){h.push({R:'P',S:'R',P:'S'}[oTop])}
      else if(mh[mTop]>0&&r<.5){h.push(mTop)}
      else if(prev&&r<.8){const cnt={R:0,S:0,P:0};prev.forEach(x=>{if(cnt[x]!=null)cnt[x]++});
        const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];const counter={R:'P',S:'R',P:'S'}[top];h.push(counter)}
      else h.push(randHand());
    }
  }
  if(!me.specialUsed&&turn>=2){
    let use=false;
    if(lv==='weak')use=Math.random()<.5;
    else use=true;
    if(use)h[rnd(6)]='X';
  }
  return h;
}

function loadUnlocked(){try{const v=JSON.parse(localStorage.getItem(UNLOCK_KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function saveUnlocked(a){try{localStorage.setItem(UNLOCK_KEY,JSON.stringify(a))}catch(e){}}
function prepHidden(h){return Object.assign({},h,{builtin:true,hidden:true,fx:h.fx||detectFx(h.special),type:h.type||'balance'})}
function lockedHidden(){const u=loadUnlocked();return HIDDEN.filter(h=>!u.includes(h.id)).map(prepHidden)}
function randomCpu(exclude){const prev=S.lastCpu;const pool=S.chars.concat(lockedHidden(),lockedOnline());let p=pool.filter(c=>c.id!==exclude);if(p.length>2)p=p.filter(c=>c.id!==prev);const a=p.length?p:pool.length?pool:(S.samples||[]);const c=a[rnd(a.length)];S.lastCpu=c.id;return c}
function loadRecs(){try{const v=JSON.parse(localStorage.getItem(REC_KEY)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}}
function saveRecs(r){try{localStorage.setItem(REC_KEY,JSON.stringify(r))}catch(e){}}
function recOf(id){const r=loadRecs()[id]||{};return {w:r.w|0,l:r.l|0,d:r.d|0,titles:Array.isArray(r.titles)?r.titles:[]}}
function recordMatch(M,w,titles){const R=loadRecs();
  for(const s of [0,1]){const id=M.F[s].ch.id;if(!id)continue;if(s===1&&M.F[1].ch.id===M.F[0].ch.id&&w<0)continue;const r=R[id]||{w:0,l:0,d:0,titles:[]};
    if(w<0)r.d=(r.d|0)+1;else if(w===s){r.w=(r.w|0)+1;for(const t of titles)if(!r.titles.includes(t))r.titles.push(t)}else r.l=(r.l|0)+1;R[id]=r}
  saveRecs(R)}
function recHTML(id){const r=recOf(id);if(!r.w&&!r.l&&!r.d)return '<div class="rec muted">まだ戦っていない</div>';
  return `<div class="rec"><b>${r.w}勝</b> ${r.l}敗${r.d?` ${r.d}分`:''}</div>${r.titles.length?`<div class="rect">${r.titles.slice(-3).map(t=>`<span>${esc(t)}</span>`).join('')}${r.titles.length>3?`<span>ほか${r.titles.length-3}</span>`:''}</div>`:''}`}

const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
function ownerKey(){let k=lsGet(OWNER_KEY,'');if(!/^[a-f0-9]{32}$/.test(k)){const a=new Uint8Array(16);crypto.getRandomValues(a);k=[...a].map(x=>x.toString(16).padStart(2,'0')).join('');lsSet(OWNER_KEY,k)}return k}

async function arenaReq(path,body,ms=15000){const ac=new AbortController();const tm=setTimeout(()=>ac.abort(),ms);

function coach(steps){return new Promise(async res=>{
  document.querySelectorAll('.coach').forEach(e=>e.remove());
  const o=document.createElement('div');o.className='coach';o.innerHTML='<div class="hole"></div><div class="bub"><div data-tx></div><small data-ft></small></div><button class="skip" data-skip>説明をとばす</button>';
  document.body.appendChild(o);const hole=$('.hole',o),bub=$('.bub',o);let skipped=false;
  $('[data-skip]',o).onclick=e=>{e.stopPropagation();skipped=true;o.remove();if(S.match)S.match.tutSkip=true;res()};
  const list=steps.filter(st=>!st.sel||document.querySelector(st.sel));
  for(let i=0;i<list.length;i++){const st=list[i];if(skipped||!document.body.contains(o))return;
    const el=st.sel?document.querySelector(st.sel):null;
    o.classList.toggle('full',!el);o.classList.toggle('act',!!st.wait);
    if(el){el.scrollIntoView({block:'nearest'});const rs=[el,...(st.also||[]).map(q=>document.querySelector(q)).filter(Boolean)].map(e=>e.getBoundingClientRect());
      const r={left:Math.min(...rs.map(x=>x.left)),top:Math.min(...rs.map(x=>x.top)),right:Math.max(...rs.map(x=>x.right)),bottom:Math.max(...rs.map(x=>x.bottom))};r.width=r.right-r.left;r.height=r.bottom-r.top;const p=5;
      Object.assign(hole.style,{display:'block',left:(r.left-p)+'px',top:(r.top-p)+'px',width:(r.width+2*p)+'px',height:(r.height+2*p)+'px'});
      const below=r.top+r.height/2<innerHeight/2;bub.style.top=below?Math.min(r.bottom+14,innerHeight-160)+'px':'';bub.style.bottom=below?'':Math.min(innerHeight-r.top+14,innerHeight-160)+'px'}
    else{hole.style.display='none';bub.style.top='34%';bub.style.bottom=''}
    $('[data-tx]',o).innerHTML=st.text;$('[data-ft]',o).textContent=st.wait?'やってみよう':`タップで次へ（${i+1}/${list.length}）`;
    await new Promise(r2=>{if(st.wait){const w=document.querySelector(st.wait);if(!w)return r2();const h=()=>{w.removeEventListener('click',h,true);r2()};w.addEventListener('click',h,true)}
      else o.onclick=()=>{o.onclick=null;r2()}});
  }
  o.remove();res()})}

function exportChars(){
  const list=S.chars.filter(c=>!c.builtin).map(c=>{const o=Object.assign({},c);delete o.fx;return o});
  const json=JSON.stringify({game:'saikyo-royale',v:1,chars:list});const name='saikyo-chars.json';
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="panel"><div style="font-size:18px">自作キャラ${list.length}体を書き出す</div><div class="muted" style="font-size:13px">できたファイル（またはコピーした文字）を、Claudeとのチャットに送る</div>
    <button class="btn orange small" data-f>📄 ファイルにする</button><button class="btn blue small" data-c>📋 コピーする</button><button class="btn gray small" data-x>閉じる</button></div>`;
  app.appendChild(m);const close=()=>m.remove();$('[data-x]',m).onclick=close;
  $('[data-f]',m).onclick=async()=>{const file=new File([json],name,{type:'application/json'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});close();return}}catch(e){if(e&&e.name==='AbortError')return}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('ファイルを保存した');close()}catch(e){toast('ファイルにできなかった。「コピーする」を使ってください',2600)}};

    if(!ok){try{const t=document.createElement('textarea');t.value=json;document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove()}catch(e){}}

}

function startMatch(){
  const c0=S.chars.find(c=>c.id===S.pick[0]);let c1=S.chars.find(c=>c.id===S.pick[1]);let found=false;

  if(!c1&&S.cpuPick&&S.cpuPick.id===S.pick[1]&&S.cpuPick.online){c1=S.cpuPick;if(unlockOnline(c1)){found='online'}
    const at=S.chars.findIndex(c=>!c.builtin);S.chars.splice(at<0?S.chars.length:at,0,c1)}
  if(!c1&&S.cpuPick&&S.cpuPick.id===S.pick[1]){c1=S.cpuPick;if(c1.hidden){const u=loadUnlocked();if(!u.includes(c1.id)){u.push(c1.id);saveUnlocked(u);found=true}
    const at=S.chars.findIndex(c=>!c.builtin);S.chars.splice(at<0?S.chars.length:at,0,c1)}}
  const LV=S.mode==='cpu'&&!S.vsOnline?cpuLvInfo():null;
  S.match={F:[newFighter(c0),newFighter(c1)],turn:1,history:[],cpu:S.mode==='cpu',vsOnline:S.mode==='cpu'&&!!S.vsOnline,cpuLevel:LV?LV.brain:S.cpuLevel,lv:LV,cpuSpecialTurn:2+rnd(2),
    stats:[{mikiri:0,maxCombo:0,specialFinish:false,behind:false},{mikiri:0,maxCombo:0,specialFinish:false,behind:false}],hands:[null,null]};
  const M=S.match;M.found=found;if(LV&&LV.hp){M.F[1].maxHp+=LV.hp;M.F[1].hp+=LV.hp}setFacing(M).then(()=>{if(S.match===M)showPrep()});
}

function showInput(side,done){

    `<div class="inhead"><h3>${sideTag(side,M)}の手を6つ選ぶ</h3><div class="timer" data-timer><span data-t>${Math.ceil(limit)}</span></div></div>
    <div class="slots" data-slots>${[0,1,2,3,4,5].map(i=>`<div class="slot" data-slot="${i}">${i+1}</div>`).join('')}</div>
    <div class="spacer"></div>

    <div class="pick">${['R','S','P'].map(h=>`<button class="pk ${h}" data-h="${h}" style="position:relative">${me.hands[h]?`<small class="hb ${me.hands[h]>0?'up':'dn'}">${me.hands[h]>0?'+':'−'}${Math.abs(me.hands[h])}</small>`:''}<img src="${HAND_IMG[h]}" alt="">${HAND_NAME[h]}</button>`).join('')}
      ${me.specialUsed&&M.turn>=2?'':`<button class="pk X" data-h="X" ${canSpecial?'':'disabled'}>${SPECIAL_SVG}必殺</button>`}</div>
    <div class="row"><button class="btn gray small" data-undo>↶ 戻す</button><button class="btn orange small" data-done disabled>確定</button></div>`,'dim side'+(side+1));

      el.innerHTML=h?(h==='X'?`<small>${i+1}</small>${SPECIAL_SVG}`:`<small>${i+1}</small><img src="${HAND_IMG[h]}" alt="">`):String(i+1)});
    const xb=$('[data-h="X"]',d);if(xb)xb.disabled=!canSpecial||hands.includes('X')||hands.length>=6;

    tEl.textContent=Math.max(0,Math.ceil(left));tw.style.setProperty('--p',Math.max(0,left/limit*100)+'%');tw.classList.toggle('warn',left<3.5);

/* ========= battle playback ========= */
async function playTurn(){
  const M=S.match;const H=M.hands;
  const hpBefore=[M.F[0].hp,M.F[1].hp];
  const events=resolveTurn(M.F,H,M.turn,M.stats);
  M.history.push([H[0].slice(),H[1].slice()]);
  const d=screen(QUIT_BAR+hpBarHTML(M)+`<div class="panel reveal" data-rev>${[0,1].map(s=>H[s].map((h,i)=>`<span class="mini q" data-r="${s}-${i}">?</span>`).join('')).join('<div class="sep"></div>')}</div>
    <div class="stage" data-stage><div class="fighter l" data-f="0"><img src="${M.F[0].img}" alt=""></div><div class="fighter r" data-f="1"><img src="${M.F[1].img}" alt=""></div></div>`,'');
  updateHP(d,M,hpBefore);bindQuit(d);
  const stage=$('[data-stage]',d);
  const hint=document.createElement('div');hint.className='ffhint';hint.textContent='画面タップで早送り';stage.appendChild(hint);
  const baseSpeed=SPEED;
  d.addEventListener('pointerdown',ev=>{if(ev.target.closest('[data-quit]'))return;SPEED=baseSpeed*.35;hint.textContent='▶▶ 早送り中'});
  await sleep(450);
  for(const e of events){
    if(!alive(M)){SPEED=baseSpeed;return}
    for(const s of [0,1]){const el=$(`[data-r="${s}-${e.i}"]`,d);const h=H[s][e.i];el.outerHTML=handMini(h,'on').replace('class="mini','data-r="'+s+'-'+e.i+'" class="mini')}
    const ra=$(`[data-r="0-${e.i}"]`,d),rb=$(`[data-r="1-${e.i}"]`,d);
    if(e.w!=null){(e.w===0?ra:rb).classList.add('win');(e.w===0?rb:ra).classList.add('lose')}
    await playEvent(stage,d,M,e);
    updateHP(d,M,e.hp);
    if(e.ko!=null)break;
    await sleep(120);
  }
  await sleep(400);
  if(!alive(M)){SPEED=baseSpeed;return}
  const ko=M.F[0].hp<=0||M.F[1].hp<=0;

function dataURLtoBlob(u){const [h,b]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/png';const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}

function kanteiPrompt(C){return `子どもが紙に描いたオリジナルキャラクターの絵です。対戦ゲームの「キャラ鑑定」をします。

function cleanKantei(r){

  const rs=r.stats||{};const stats=normStats({a:rs.attack,d:rs.defense,h:rs.hp,s:rs.speed});
  const rh=r.hands||{};const hands=normHands({R:rh.rock,S:rh.scissors,P:rh.paper});
  let style=String(r.style||'').replace(/[<>]/g,'').trim().slice(0,10);if(style&&!style.endsWith('型'))style+='型';
  const lines=a=>(Array.isArray(a)?a:[]).map(x=>String(x||'').replace(/[<>「」]/g,'').trim().slice(0,36)).filter(Boolean).slice(0,3);
  return {winLines:lines(r.win_lines),feats:out,stats,hands,style:style||TYPES[nearestType(stats)].n,handNote:String(r.hand_note||'').trim().slice(0,24),alias:String(r.alias||'').trim().slice(0,14),comment:String(r.comment||'').trim().slice(0,40)};
}

  const lines=C.feats.length?C.feats.map(f=>`${esc(f.name)}を検知 ── <b>${STAT_NAMES[f.stat]}上昇</b>`):['均整の取れた肉体を検知 ── <b>全能力均衡</b>'];
  const d=screen(hdr('鑑定の儀',false)+`<div class="kantei"><div class="scan"><img src="${C.final}" alt=""></div>${lines.map(l=>`<div class="kline">${l}</div>`).join('')}${C.ai?`<div class="kline" style="font-size:15px">拳の相性 ── <b>${handsText(C.hands)}</b>${C.handNote?`<br><span style="font-size:12px;color:#d8d3c6">${esc(C.handNote)}</span>`:''}</div>`:''}${C.comment?`<div class="kline" style="font-size:14px;color:#d8d3c6">「${esc(C.comment)}」</div>`:''}
    <div class="kres">判定：${esc(t.n)}</div>${C.alias?`<div class="kline" data-alias style="font-size:16px">二つ名：<b>${esc(C.alias)}</b></div>`:''}</div>
    <div class="panel statbox" style="opacity:0" data-sb>${['a','d','h','s'].map(k=>`<div class="st"><span>${STAT_NAMES[k]}</span><div class="g"><i data-g="${k}"></i></div><b>${t[k]}</b></div>`).join('')}<div class="muted">HP ${hpOf(t)}　合計120</div></div>
    <div class="spacer"></div><div class="row"><button class="btn gray small" data-re style="visibility:hidden;flex:0 0 34%">${C.ai?'再鑑定':'選び直す'}</button><button class="btn orange small" data-ok style="visibility:hidden">✔ このキャラで決定</button></div>`,'dim');
  await sleep(900);
  for(const el of $$('.kline',d)){el.classList.add('on');await sleep(650)}
  $('.scan',d).classList.remove('scan');
  $('.kres',d).classList.add('on');await sleep(400);{const al=$('[data-alias]',d);if(al){al.classList.add('on');await sleep(300)}}
  const sb=$('[data-sb]',d);sb.style.opacity=1;sb.style.transition='opacity .3s';
  await sleep(50);for(const k of ['a','d','h','s'])$(`[data-g="${k}"]`,d).style.width=t[k]*2+'%';
  await sleep(500);
  $('[data-re]',d).style.visibility='visible';$('[data-ok]',d).style.visibility='visible';
  $('[data-re]',d).onclick=()=>C.ai?createKantei(C):createKanteiManual(C);
  $('[data-ok]',d).onclick=()=>{const ch={id:'u'+Date.now().toString(36)+rnd(1000),name:C.name,bio:C.bio,alias:C.alias,special:C.special,desc:C.desc,features:C.feats.map(f=>f.name),feats:C.feats.slice(),type,stats:{...C.stats},style:C.style,hands:{...C.hands},winLines:(C.ai&&C.winLines)||[],fx:C.fx||detectFx(C.special),img:C.final};
    S.chars.push(ch);if(!saveUserChars())toast('この端末に記録できなかった（ページを閉じると消える）',3000);
    showCreated(ch,C.onDone)};
}

function showCreated(ch,onDone){
  const st=statsOf(ch);
  const d=screen(hdr('召喚完了',false)+`<div class="spacer"></div><div class="kantei"><div class="spot" style="min-height:200px;flex:none;width:100%"><img class="win" src="${ch.img}" alt=""></div>
    <div style="font-size:22px">${esc(ch.name)}</div>${ch.alias?`<div style="color:#f2c46b">${esc(ch.alias)}</div>`:''}<div class="muted">${esc(st.n)}・HP${hpOf(st)}・${handsText(handsOf(ch))}</div></div>
    <div class="muted" style="text-align:center">キャラ一覧に登録した。このままバトルする？</div><div class="spacer"></div>
    ${ARENA?'<button class="btn orange" data-pub>🌐 みんなの闘技場に解き放つ</button>':''}
    <button class="btn blue" data-fight>⚔ このキャラでバトルする</button>
    <div class="row"><button class="btn gray small" data-more>✎ もう1体つくる</button><button class="btn gray small" data-home>トップに戻る</button></div>`,'dim');
  $('[data-fight]',d).onclick=()=>{if(onDone&&onDone.pickSide!=null){const sd=onDone.pickSide;S.pick[sd]=ch.id;if(sd===0)afterP1();else startMatch()}else{S.preset=ch.id;showMode()}};
  $('[data-more]',d).onclick=()=>showCreate(onDone);
  {const pb=$('[data-pub]',d);if(pb)pb.onclick=()=>publishChar(ch,()=>showCreated(ch,onDone))}
  $('[data-home]',d).onclick=()=>showHome();
}
/* ========= boot ========= */
(async function boot(){
  app.innerHTML='<div class="screen" style="align-items:center;justify-content:center"><img src="'+AS.emblem+'" style="width:120px;opacity:.8" alt=""><div class="muted">召喚陣を展開中……</div></div>';
  initSample();
  const samples=await buildSamples();S.samples=samples;
  {const u=loadUnlocked();S.chars=samples.concat(HIDDEN.filter(h=>u.includes(h.id)).map(prepHidden))}
  S.chars=S.chars.concat(onlineUnlocked().filter(c=>c&&c.img&&validStats(c.stats)).map(c=>Object.assign(c,{online:true,builtin:true,fx:detectFx(c.special||'')})));
  S.chars=S.chars.concat(loadUserChars().filter(c=>c&&c.img&&(TYPES[c.type]||validStats(c.stats))));
  {const rm=lsGet(REMOVED_KEY,[]);S.chars=S.chars.filter(c=>!rm.includes(c.id))}
  showHome();loadOnline();
})();
window.__game={setMikiri:v=>MIKIRI_DMG=v,S,TYPES,normStats,normHands,statsOf,cleanKantei,typeFromCats,resolveTurn,detectFx,fxCandidates,typeFromFeatures,newFighter,cpuHands,setSpeed:v=>SPEED=v};
</script>
</body>
</html>
